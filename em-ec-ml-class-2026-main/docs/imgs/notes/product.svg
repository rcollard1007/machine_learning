<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Big picture of a live service operated by a Machine Learning model</title>
  <defs>
    <style>
      .h1 { font-size: 24px; font-weight: 700; fill: #111827; }
      .h1-sub { font-size: 14px; fill: #6b7280; }
      .blk { font-size: 17px; font-weight: 700; }
      .blk-sub { font-size: 13px; font-weight: 400; fill: #6b7280; }
      .badge { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .t { font-size: 14px; font-weight: 600; fill: #1f2937; text-anchor: middle; }
      .ts { font-size: 11px; fill: #6b7280; text-anchor: middle; }
      .sub-h { font-size: 13px; font-weight: 700; fill: #66368a; }
      .lbl { font-size: 11px; font-style: italic; fill: #4b5563; }
      .lbl-mon { font-size: 11px; font-style: italic; fill: #7a4b9c; }
      .flow { stroke: #374151; stroke-width: 1.8; fill: none; }
      .code { stroke: #6b7280; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .mon { stroke: #8e5bb0; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    </style>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="a-mon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e5bb0"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="44" class="h1">ML-powered live service</text>
  <text x="30" y="66" class="h1-sub">Big picture: from raw data to live predictions</text>

  <!-- ===================== External inputs ===================== -->
  <!-- GitHub repository -->
  <rect x="295" y="90" width="150" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="116" class="t">GitHub repository</text>
  <text x="370" y="134" class="ts">pipeline source code</text>

  <!-- Raw data sources -->
  <rect x="30" y="250" width="135" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="97" y="282" class="t">Raw data</text>
  <text x="97" y="299" class="t">sources</text>
  <text x="97" y="317" class="ts">files · APIs · DBs</text>

  <!-- Raw live data -->
  <rect x="1225" y="90" width="150" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1300" y="116" class="t">Raw live data</text>
  <text x="1300" y="134" class="ts">events · requests</text>

  <!-- ===================== 1) Data Engineering ===================== -->
  <rect x="200" y="200" width="340" height="380" rx="14" fill="#eaf2fb" stroke="#3a78c2" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="224" cy="228" r="12" fill="#3a78c2"/>
  <text x="224" y="233" class="badge">1</text>
  <text x="244" y="234" class="blk" fill="#1f5a99">Data Engineering</text>

  <rect x="240" y="265" width="260" height="50" rx="8" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="370" y="286" class="t">Raw data ingestion</text>
  <text x="370" y="304" class="ts">batch · streaming</text>

  <rect x="240" y="345" width="260" height="50" rx="8" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="370" y="366" class="t">Data transformation</text>
  <text x="370" y="384" class="ts">clean · validate · enrich</text>

  <rect x="240" y="425" width="260" height="50" rx="8" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="370" y="446" class="t">Data serialization</text>
  <text x="370" y="464" class="ts">Parquet · tables</text>

  <!-- Target storage (cylinder) -->
  <path d="M240,508 L240,557 A130,8 0 0 0 500,557 L500,508 Z" fill="#ffffff" stroke="#3a78c2" stroke-width="1.5"/>
  <ellipse cx="370" cy="508" rx="130" ry="8" fill="#d6e6f7" stroke="#3a78c2" stroke-width="1.5"/>
  <text x="370" y="536" class="t">Target storage</text>
  <text x="370" y="553" class="ts">data lake · warehouse</text>

  <line x1="370" y1="315" x2="370" y2="345" class="flow" marker-end="url(#a-flow)"/>
  <line x1="370" y1="395" x2="370" y2="425" class="flow" marker-end="url(#a-flow)"/>
  <line x1="370" y1="475" x2="370" y2="500" class="flow" marker-end="url(#a-flow)"/>

  <!-- ===================== 2) ML Engineering ===================== -->
  <rect x="590" y="200" width="410" height="380" rx="14" fill="#fdf3e3" stroke="#d9892b" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="614" cy="228" r="12" fill="#d9892b"/>
  <text x="614" y="233" class="badge">2</text>
  <text x="634" y="234" class="blk" fill="#a35f0e">ML Engineering <tspan class="blk-sub">· model factory</tspan></text>

  <rect x="620" y="265" width="170" height="50" rx="8" fill="#ffffff" stroke="#d9892b" stroke-width="1.5"/>
  <text x="705" y="286" class="t">Data consumption</text>
  <text x="705" y="304" class="ts">features · splits</text>

  <rect x="620" y="365" width="170" height="50" rx="8" fill="#ffffff" stroke="#d9892b" stroke-width="1.5"/>
  <text x="705" y="386" class="t">Model training</text>
  <text x="705" y="404" class="ts">fit · tune</text>

  <rect x="620" y="465" width="170" height="50" rx="8" fill="#ffffff" stroke="#d9892b" stroke-width="1.5"/>
  <text x="705" y="486" class="t">Model evaluation</text>
  <text x="705" y="504" class="ts">test set · metrics</text>

  <line x1="705" y1="315" x2="705" y2="365" class="flow" marker-end="url(#a-flow)"/>
  <line x1="705" y1="415" x2="705" y2="465" class="flow" marker-end="url(#a-flow)"/>

  <!-- Artifact storage -->
  <rect x="815" y="250" width="165" height="310" rx="10" fill="#fbe7c8" stroke="#d9892b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="897" y="276" class="t" style="font-size:13px; fill:#a35f0e">Artifact storage</text>

  <rect x="830" y="300" width="135" height="50" rx="8" fill="#ffffff" stroke="#d9892b" stroke-width="1.5"/>
  <text x="897" y="322" class="t" style="font-size:13px">Train logs</text>
  <text x="897" y="339" class="ts">loss · params</text>

  <rect x="830" y="385" width="135" height="50" rx="8" fill="#ffffff" stroke="#d9892b" stroke-width="1.5"/>
  <text x="897" y="407" class="t" style="font-size:13px">Model artifacts</text>
  <text x="897" y="424" class="ts">weights · pipeline</text>

  <rect x="830" y="470" width="135" height="50" rx="8" fill="#ffffff" stroke="#d9892b" stroke-width="1.5"/>
  <text x="897" y="492" class="t" style="font-size:13px">Eval metrics</text>
  <text x="897" y="509" class="ts">scores · reports</text>

  <path d="M790,390 H805 V325 H830" class="flow" marker-end="url(#a-flow)"/>
  <path d="M790,390 H805 V410 H830" class="flow" marker-end="url(#a-flow)"/>
  <line x1="790" y1="492" x2="830" y2="492" class="flow" marker-end="url(#a-flow)"/>

  <!-- ===================== 3) Live Service ===================== -->
  <rect x="1050" y="200" width="340" height="380" rx="14" fill="#e8f5ec" stroke="#3c9a5f" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="1074" cy="228" r="12" fill="#3c9a5f"/>
  <text x="1074" y="233" class="badge">3</text>
  <text x="1094" y="234" class="blk" fill="#24703f">Live Service</text>

  <rect x="1070" y="270" width="140" height="50" rx="8" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="1140" y="291" class="t" style="font-size:13px">Model loading</text>
  <text x="1140" y="309" class="ts">trained artifact</text>

  <rect x="1230" y="270" width="140" height="50" rx="8" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="1300" y="291" class="t" style="font-size:13px">Live data intake</text>
  <text x="1300" y="309" class="ts">preprocessing</text>

  <rect x="1070" y="370" width="300" height="50" rx="8" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="1220" y="391" class="t">Inference</text>
  <text x="1220" y="409" class="ts">model.predict(live features)</text>

  <rect x="1070" y="470" width="300" height="50" rx="8" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="1220" y="491" class="t">Metrics exporter</text>
  <text x="1220" y="509" class="ts">/metrics · latency · throughput · errors</text>

  <line x1="1140" y1="320" x2="1140" y2="370" class="flow" marker-end="url(#a-flow)"/>
  <line x1="1300" y1="320" x2="1300" y2="370" class="flow" marker-end="url(#a-flow)"/>
  <line x1="1220" y1="420" x2="1220" y2="470" class="flow" marker-end="url(#a-flow)"/>

  <!-- Predictions output -->
  <rect x="1430" y="355" width="140" height="80" rx="10" fill="#3c9a5f" stroke="#24703f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1500" y="388" class="t" fill="#ffffff" style="fill:#ffffff">Predictions</text>
  <text x="1500" y="408" class="ts" style="fill:#e8f5ec; font-size:12px">live stream</text>
  <line x1="1370" y1="395" x2="1430" y2="395" class="flow" marker-end="url(#a-flow)"/>

  <!-- ===================== 4) Monitoring ===================== -->
  <rect x="200" y="630" width="1190" height="200" rx="14" fill="#f4ecf8" stroke="#8e5bb0" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="224" cy="658" r="12" fill="#8e5bb0"/>
  <text x="224" y="663" class="badge">4</text>
  <text x="244" y="664" class="blk" fill="#66368a">Monitoring</text>

  <!-- ETL monitoring -->
  <rect x="225" y="680" width="290" height="130" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#8e5bb0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="500" y="703" class="sub-h" text-anchor="end">ETL monitoring</text>
  <rect x="245" y="725" width="120" height="60" rx="8" fill="#ffffff" stroke="#8e5bb0" stroke-width="1.5"/>
  <text x="305" y="751" class="t" style="font-size:13px">Event logs</text>
  <text x="305" y="768" class="ts">runs · failures</text>
  <rect x="390" y="725" width="110" height="60" rx="8" fill="#ffffff" stroke="#8e5bb0" stroke-width="1.5"/>
  <text x="445" y="751" class="t" style="font-size:13px">Alerting</text>
  <text x="445" y="768" class="ts">email · chat</text>
  <line x1="365" y1="755" x2="390" y2="755" class="flow" marker-end="url(#a-flow)"/>

  <!-- ML monitoring -->
  <rect x="610" y="680" width="375" height="130" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#8e5bb0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="625" y="703" class="sub-h">ML monitoring</text>
  <rect x="640" y="725" width="315" height="60" rx="8" fill="#ffffff" stroke="#8e5bb0" stroke-width="1.5"/>
  <text x="797" y="751" class="t" style="font-size:15px">MLflow</text>
  <text x="797" y="768" class="ts">experiment tracking · train / eval logs · metrics</text>

  <!-- Service monitoring -->
  <rect x="1065" y="680" width="310" height="130" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#8e5bb0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1360" y="703" class="sub-h" text-anchor="end">Service monitoring</text>
  <rect x="1085" y="725" width="120" height="60" rx="8" fill="#ffffff" stroke="#8e5bb0" stroke-width="1.5"/>
  <text x="1145" y="751" class="t" style="font-size:13px">Prometheus</text>
  <text x="1145" y="768" class="ts">metrics scraping</text>
  <rect x="1245" y="725" width="110" height="60" rx="8" fill="#ffffff" stroke="#8e5bb0" stroke-width="1.5"/>
  <text x="1300" y="751" class="t" style="font-size:13px">Grafana</text>
  <text x="1300" y="768" class="ts">dashboards</text>
  <line x1="1205" y1="755" x2="1245" y2="755" class="flow" marker-end="url(#a-flow)"/>

  <!-- ===================== Cross-block flows ===================== -->
  <!-- Source code loading -->
  <line x1="370" y1="150" x2="370" y2="200" class="code" marker-end="url(#a-code)"/>
  <text x="380" y="180" class="lbl">loads source code</text>

  <!-- Raw data -> ingestion -->
  <line x1="165" y1="290" x2="240" y2="290" class="flow" marker-end="url(#a-flow)"/>

  <!-- Target storage -> data consumption -->
  <path d="M500,532 H565 V290 H620" class="flow" marker-end="url(#a-flow)"/>

  <!-- Model artifacts -> model loading -->
  <path d="M965,410 H1025 V295 H1070" class="flow" marker-end="url(#a-flow)"/>

  <!-- Raw live data -> live data intake -->
  <line x1="1300" y1="150" x2="1300" y2="270" class="flow" marker-end="url(#a-flow)"/>

  <!-- Monitoring signals -->
  <line x1="350" y1="580" x2="350" y2="725" class="mon" marker-end="url(#a-mon)"/>
  <text x="360" y="610" class="lbl-mon">pipeline events</text>

  <line x1="897" y1="560" x2="897" y2="725" class="mon" marker-end="url(#a-mon)"/>
  <text x="907" y="610" class="lbl-mon">train logs · eval metrics</text>

  <line x1="1145" y1="520" x2="1145" y2="725" class="mon" marker-end="url(#a-mon)"/>
  <text x="1155" y="610" class="lbl-mon">service metrics</text>

  <!-- ===================== Legend ===================== -->
  <line x1="200" y1="868" x2="240" y2="868" class="flow" marker-end="url(#a-flow)"/>
  <text x="250" y="872" class="lbl" style="font-style:normal">data / model flow</text>
  <line x1="390" y1="868" x2="430" y2="868" class="code" marker-end="url(#a-code)"/>
  <text x="440" y="872" class="lbl" style="font-style:normal">source code loading</text>
  <line x1="590" y1="868" x2="630" y2="868" class="mon" marker-end="url(#a-mon)"/>
  <text x="640" y="872" class="lbl" style="font-style:normal">monitoring signals</text>
</svg>
